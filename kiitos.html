<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiitos palautteesta! – Uutisraportti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..800&family=Google+Sans+Code:wght@400..500&display=swap" rel="stylesheet">
  <!-- Teema: oletuksena laitteen asetus; käyttäjän valinta (teemakytkin) talletetaan.
       Ajetaan ennen tyylejä, jottei sivu välähdä väärässä teemassa. -->
  <script>
    try {
      var t = localStorage.getItem('teema');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body style="margin: 0; min-height: 100vh;">
  <div class="app">
    <header class="hero" style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center;">
      <div class="hero-content">
        <h1 class="hero-title">Kiitos palautteesta!</h1>
        <p class="hero-subtitle" style="margin-bottom: 40px;">Viestisi on lähetetty onnistuneesti ja se auttaa meitä kehittämään palvelua.</p>
        <a href="/" class="submit-btn" style="display: inline-block; max-width: 250px; text-decoration: none;">Palaa etusivulle</a>
      </div>
    </header>
  </div>
  <!-- Kävijämittaus (GoatCounter): evästeetön, vain tuotantodomainilla,
       jotta dev-kokeiluversio ja paikallinen selailu eivät kirjaudu tilastoihin -->
  <script>
    if (location.hostname === 'uutisrapsa.fi' || location.hostname === 'www.uutisrapsa.fi') {
      var gc = document.createElement('script');
      gc.async = true;
      gc.src = 'https://gc.zgo.at/count.js';
      gc.dataset.goatcounter = 'https://uutisrapsa.goatcounter.com/count';
      document.body.appendChild(gc);
    }
  </script>
</body>
</html>
