  document.getElementById('add-form-' + jakso_id).style.display = 'none';
  document.getElementById('add-btn-' + jakso_id).style.display = 'block';
}

function lisaaUusi(jakso_id) {
  const arvo = kentta => document.getElementById(`add-${kentta}-${jakso_id}`).value.trim();
  const teos = arvo('teos');
  const suosittelija = arvo('suo');
  if (!teos || !suosittelija) {
    showToast('Teos ja suosittelija ovat pakollisia.', 3500);
    return;
  }
  const google = hakulinkki(teos);
  const uusi_data = {
    teos,
    suosittelija,
    kuvaus: arvo('kuvaus'),
    paakategoria: arvo('paak'),
    kategoriat: arvo('tagit').split(',').map(s => s.trim()).filter(s => s),
    google_linkki: google,
    lisatieto_linkki: arvo('linkki'),
  };
  if (uusi_data.paakategoria === 'podcast' && arvo('alkupera')) uusi_data.alkupera = arvo('alkupera');
  if (uusi_data.paakategoria === 'podcast') {
    const lisalinkit = lueLisalinkit('add', jakso_id);
    if (!lisalinkit) return;
    if (lisalinkit.length) uusi_data.lisalinkit = lisalinkit;
  }
  NEW_RECS.push({ tmp_id: ++newRecSeq, jakso_id, uusi_data });
  updateSaveBtn();
  refreshCard(jakso_id);
  showToast(`Lisätty tallennettavaksi: ${teos}`);
}

function poistaUusi(tmp_id) {
  const n = NEW_RECS.find(x => x.tmp_id === tmp_id);
  if (!n) return;
  NEW_RECS = NEW_RECS.filter(x => x.tmp_id !== tmp_id);
  updateSaveBtn();
  refreshCard(n.jakso_id);
}

function refreshCard(jakso_id) {
  const jakso = DATA.find(j => j.jakso_id === jakso_id);
  const card = document.getElementById('card-' + jakso_id);
  if (jakso && card) card.outerHTML = renderCard(jakso);
}

// =====================================================
// JÄRJESTYKSEN MUUTOS
// Tallennus (netlify/functions/jarjesta.js) muuttaa kerralla sekä järjestyksen
// että kaikki r_idx-viitteet (korjaukset, ohitukset, validointidata), koska
// korjaukset ajetaan joka kerta uudelleen paikkanumeron perusteella.
// =====================================================
let JARJESTYS = {};  // jakso_id → vanhat r_idx:t muokattavassa järjestyksessä

function jarjestysEste(jakso) {
  const id = jakso.jakso_id;
  if (NEW_RECS.some(n => n.jakso_id === id)) return 'Tallenna tai poista ensin jakson uudet suositukset.';
  const tallentamaton = Object.entries(CORRECTIONS).some(([k, c]) =>
    k.startsWith(id + ':') && c && !c.saved && (c.is_edited || c.skipped));
  if (tallentamaton) return 'Tallenna tai kumoa ensin jakson muut muutokset.';
  if (jakso.suositukset.some(r => r.odottava)) return 'Jaksossa on lisäys, jota ei ole vielä julkaistu. Odota pari minuuttia ja lataa sivu uudelleen.';
  return null;
}

function aloitaJarjestys(jakso_id) {
  const jakso = DATA.find(j => j.jakso_id === jakso_id);
  if (!jakso) return;
  const este = jarjestysEste(jakso);
  if (este) { showToast(este, 5000); return; }
  JARJESTYS[jakso_id] = jakso.suositukset.map(r => r.r_idx);
  refreshCard(jakso_id);
}

function peruJarjestys(jakso_id) {
  delete JARJESTYS[jakso_id];
  refreshCard(jakso_id);
}

function siirraSuositus(jakso_id, paikka, suunta) {
  const jarj = JARJESTYS[jakso_id];
  const kohde = paikka + suunta;
  if (!jarj || kohde < 0 || kohde >= jarj.length) return;
  [jarj[paikka], jarj[kohde]] = [jarj[kohde], jarj[paikka]];
  refreshCard(jakso_id);
  // Pidä fokus siirretyssä rivissä, jotta sitä voi siirtää heti uudelleen (näppäimistö)
  const nappi = document.querySelector(`#card-${CSS.escape(jakso_id)} [data-siirto="${kohde}:${suunta}"]`);
  if (nappi && !nappi.disabled) nappi.focus();
}

function renderJarjestys(jakso) {
  const id = jakso.jakso_id;
  const jarj = JARJESTYS[id];
  const recs = Object.fromEntries(jakso.suositukset.map(r => [r.r_idx, r]));
  const muuttunut = jarj.some((vanha, i) => vanha !== i);
  const rivit = jarj.map((vanha, i) => {
    const rec = recs[vanha];
    return `
    <div class="jarjestys-rivi${vanha !== i ? ' siirretty' : ''}">
      <span class="jarjestys-nro">${i + 1}.</span>
      <div class="jarjestys-teksti">${escHtml(rec.teos)}<span>${escHtml(rec.suosittelija)}</span></div>
      <button class="siirto-btn" data-siirto="${i}:-1" onclick="siirraSuositus('${id}', ${i}, -1)" ${i === 0 ? 'disabled' : ''} aria-label="Siirrä ylös">↑</button>
      <button class="siirto-btn" data-siirto="${i}:1" onclick="siirraSuositus('${id}', ${i}, 1)" ${i === jarj.length - 1 ? 'disabled' : ''} aria-label="Siirrä alas">↓</button>
    </div>`;
  }).join('');
  return `
  <div class="jarjestys-ohje">Järjestä suositukset siihen järjestykseen, jossa ne mainitaan jaksossa. Tallennus julkaistaan heti.</div>
  ${rivit}
  <div class="rec-actions" style="margin-top: 12px; justify-content: flex-end;">
    <button class="action-btn btn-skip" onclick="peruJarjestys('${id}')">Peruuta</button>
    <button class="action-btn btn-primary" id="jarjestys-tallenna-${id}" onclick="tallennaJarjestys('${id}')" ${muuttunut ? '' : 'disabled'}>Tallenna järjestys</button>
  </div>`;
}

async function tallennaJarjestys(jakso_id) {
  const jakso = DATA.find(j => j.jakso_id === jakso_id);
  const jarj = JARJESTYS[jakso_id];
  if (!jakso || !jarj) return;
  const recs = Object.fromEntries(jakso.suositukset.map(r => [r.r_idx, r]));
  const nappi = document.getElementById('jarjestys-tallenna-' + jakso_id);
  nappi.disabled = true;
  nappi.textContent = 'Tallennetaan…';
  try {
    const response = await fetch('/.netlify/functions/jarjesta', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminToken },
      body: JSON.stringify({ jakso_id, jarjestys: jarj, teokset: jarj.map(i => recs[i].teos) }),
    });
    if (response.status === 401) throw new Error('Väärä salasana.');
    const tulos = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(tulos.error || response.statusText);
    sovellaJarjestysPaikallisesti(jakso_id, jarj);
    // Järjestys muutti korjausten r_idx:t palvelimella; tuore kopio olisi vanhentunut
    unohdaTuore('korjaukset.json');
    delete JARJESTYS[jakso_id];
    refreshCard(jakso_id);
    showToast('Järjestys tallennettu. Julkinen sivu päivittyy noin minuutin kuluttua.', 5000);
  } catch (err) {
    console.error('Järjestyksen tallennus epäonnistui:', err);
    showToast('Virhe: ' + err.message, 7000);
    nappi.disabled = false;
    nappi.textContent = 'Tallenna järjestys';
  }
}

// Sama muunnos kuin palvelimella, jotta näkymä on heti ajan tasalla eikä
// deployn viive (vanha suositukset.json) sekoita seuraavia muokkauksia
function sovellaJarjestysPaikallisesti(jakso_id, jarj) {
  const uusi = {};
  jarj.forEach((vanha, i) => { uusi[vanha] = i; });
  const siirra = r => { if (r.jakso_id === jakso_id && r.r_idx in uusi) r.r_idx = uusi[r.r_idx]; };
  for (const lahde of [DATA_FULL, DATA_SUSPICIOUS]) {
    const jakso = (lahde || []).find(j => j.jakso_id === jakso_id);
    if (!jakso) continue;
    jakso.suositukset.forEach(r => { if (r.r_idx in uusi) r.r_idx = uusi[r.r_idx]; });
    jakso.suositukset.sort((a, b) => a.r_idx - b.r_idx);
  }
  (window.KORJAUKSET || []).forEach(siirra);
  (window.OHITUKSET || []).forEach(siirra);
}

// NETLIFY API CALLS
async function verifyCorrect(jakso_id, r_idx) {
  if (!confirm('Haluatko varmasti lisätä tämän pysyviin ohituksiin?')) return;
  
  const item = { jakso_id, r_idx };
  
  try {
    const response = await fetch('/.netlify/functions/ohita', {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + adminToken
        },
        body: JSON.stringify(item)
    });
    
    if (response.status === 401) throw new Error('Väärä salasana.');
    if (!response.ok) throw new Error('Palvelinvirhe: ' + response.statusText);
    
    // Päivitä paikallinen tila: merkitse suositus ei-epäilyttäväksi (ja Muutetut-näkymään vahvistetuksi)
    (window.OHITUKSET ||= []).push(item);
    const jakso = DATA.find(j => j.jakso_id === jakso_id);
    if (jakso) {
      const rec = jakso.suositukset.find(r => r.r_idx === r_idx);
      if (rec) rec.is_suspicious = false;
      // Päivitä myös DATA_SUSPICIOUS jos saatavilla
      if (DATA_SUSPICIOUS) {
        const sj = DATA_SUSPICIOUS.find(j => j.jakso_id === jakso_id);
        if (sj) {
          const sr = sj.suositukset.find(r => r.r_idx === r_idx);
          if (sr) sr.is_suspicious = false;
        }
      }
      // Päivitä myös DATA_FULL jos saatavilla
      if (DATA_FULL) {
        const fj = DATA_FULL.find(j => j.jakso_id === jakso_id);
        if (fj) {
          const fr = fj.suositukset.find(r => r.r_idx === r_idx);
          if (fr) fr.is_suspicious = false;
        }
      }
      refreshRec(jakso_id, r_idx);
      refreshCardHeader(jakso_id);
      updateStats();
    }
    
    showToast('Vahvistettu oikeaksi ja tallennettu pysyvästi.');
  } catch (err) {
    console.error('Verify failed:', err);
    showToast('Virhe: ' + err.message);
  }
}

function refreshRec(jakso_id, r_idx) {
  const jakso = DATA.find(j => j.jakso_id === jakso_id);
  if (!jakso) return;
  const rec = jakso.suositukset.find(r => r.r_idx === r_idx);
  if (!rec) return;
  const el = document.getElementById(`rec-${jakso_id}-${r_idx}`);
  if (el) el.outerHTML = renderRec(jakso, rec);
}

function refreshCardHeader(jakso_id) {
  const jakso = DATA.find(j => j.jakso_id === jakso_id);
  if (!jakso) return;
  const card = document.getElementById('card-' + jakso_id);
  if (!card) return;
  const suspiciousRecs = jakso.suositukset.filter(r => r.is_suspicious);
  const n_open = suspiciousRecs.filter(rec => {
    const c = getCorr(jakso.jakso_id, rec.r_idx);
    return !(c && (c.skipped || c.is_edited));
  }).length;
  
  const badgeRow = card.querySelector('.episode-badge-row');
  if (badgeRow) {
    const first = badgeRow.firstElementChild;
    if (first) {
      if (n_open > 0) {
        first.className = 'badge badge-warn';
        first.innerHTML = `${n_open} auki`;
      } else {
        first.className = 'badge badge-ok';
        first.innerHTML = `Valmis`;
      }
    }
  }
}

function saveChanges() {
  const corrections = [];
  DATA.forEach(jakso => {
    jakso.suositukset.forEach(rec => {
      const c = getCorr(jakso.jakso_id, rec.r_idx);
      if (c && !c.skipped && c.is_edited && !c.saved) {
        corrections.push(c.poisto ? {
          // Piilotus: suositus jää dataan paikalleen (r_idx-viitteet säilyvät)
          tyyppi: 'poisto',
          jakso_id: jakso.jakso_id,
          jakso_otsikko: jakso.jakso_otsikko,
          paivamaara: jakso.paivamaara,
          r_idx: rec.r_idx,
          teos: rec.teos
        } : {
          jakso_id: jakso.jakso_id,
          jakso_otsikko: jakso.jakso_otsikko,
          paivamaara: jakso.paivamaara,
          r_idx: rec.r_idx,
          teos: rec.teos,
          uusi_data: c.uusi_data
        });
      }
    });
  });

  // Lisäykset: r_idx:n (paikan jakson lopussa) laskee tallennusfunktio
  NEW_RECS.forEach(n => {
    const jakso = (DATA_FULL || DATA).find(j => j.jakso_id === n.jakso_id);
    corrections.push({
      tyyppi: 'lisays',
      jakso_id: n.jakso_id,
      jakso_otsikko: jakso ? jakso.jakso_otsikko : '',
      paivamaara: jakso ? jakso.paivamaara : '',
      r_idx: null,
      teos: n.uusi_data.teos,
      uusi_data: n.uusi_data
    });
  });

  // Tarkistus-välilehden päätökset: tallenna.js muuntaa hyväksytyt korjauksiksi
  const tarkistus = Tarkistus.tallennettavat();

  if (corrections.length === 0 && tarkistus.length === 0) {
    showToast('Ei muutoksia tallennettavaksi.');
    return;
  }

  const saveBtn = document.getElementById('save-btn');
  const originalHtml = saveBtn.innerHTML;
  saveBtn.disabled = true;
  saveBtn.innerHTML = '⏳ Tallennetaan ja julkaistaan...';

  fetch('/.netlify/functions/tallenna', {
    method: 'POST',
    headers: { 
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + adminToken
    },
    body: JSON.stringify({ korjaukset: corrections, tarkistus })
  })
  .then(async response => {
    if (response.status === 401) throw new Error('Väärä salasana.');
    if (!response.ok) {
        const text = await response.text();
        let viesti = text;
        try { viesti = JSON.parse(text).error || text; } catch (e) {}
        throw new Error('Palvelinvirhe: ' + viesti);
    }
    return response.json();
  })
  .then(data => {
    muistaTuoreet(data.tiedostot);
    Tarkistus.tallennettu();
    showToast('Tallennettu! Julkinen sivu päivittyy muutaman minuutin kuluessa.', 5000);
    tallennusValmis = true;
    setTimeout(() => location.reload(), 1500);
  })
  .catch(err => {
    console.error('Save failed:', err);
    showToast('Virhe: ' + err.message, 7000);
  })
  .finally(() => {
    saveBtn.disabled = false;
    saveBtn.innerHTML = originalHtml;
  });
}

function escHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// HTML-attribuutin arvoon (value="…"): HTML-entiteetit, ei kenoviivoja –
// attribuutissa kenoviiva on kirjaimellinen ja päätyisi tallennettuun dataan.
function escAttr(str) { return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// JS-merkkijonoliteraaliin inline-käsittelijän sisällä (onclick="f('…')"):
// ensin JS-escape, sitten HTML-escape, koska selain purkaa entiteetit ennen JS:n ajoa.
function escJsAttr(str) { return escAttr(JSON.stringify(String(str)).slice(1, -1).replace(/'/g, "\\'")); }

// Init
if (adminToken) {
    loadDataScriptAndInit();
}
</script>
