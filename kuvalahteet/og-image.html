<!DOCTYPE html>
<!-- Jakokuvan (og-image.png, 1200×630) lähde, Muotokirja-ilme (19.10.2026). Oikean reunan
     vuosirengaskuvio piirretään ../suositukset.jsonista samalla geometrialla kuin etusivun
     renderHeroKuvio (app.js) — ei lukumääriä tekstinä, jotta kuva ei vanhene.
     Renderöinti: kuvalahteet/tee_kuvat.sh -->
<html lang="fi"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..500&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; background: #111111; overflow: hidden; }
  body {
    position: relative;
    color: #cccccc;
    font-family: 'Geist', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .sisalto {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; justify-content: space-between;
    width: 700px; height: 630px; padding: 64px 0 60px 72px;
  }
  .merkki { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 600; letter-spacing: -0.03em; }
  .merkki svg { width: 30px; height: 30px; fill: #3bdaa5; }
  .merkki span span { color: #858585; font-weight: 500; }
  h1 { font-size: 112px; font-weight: 600; line-height: 0.95; letter-spacing: -0.05em; color: #e6e6e6; }
  h1 span { display: block; color: #3bdaa5; }
  p { margin-top: 28px; font-size: 27px; line-height: 1.35; color: #a3a3a3; letter-spacing: -0.01em; }
  .alaosa { font-family: 'Geist Mono', monospace; font-size: 21px; color: #858585; letter-spacing: 0.02em; }
  #kuvio { position: absolute; left: 700px; top: -5px; width: 640px; height: 640px; color: #6b6b6b; }
  .rengas { fill: none; stroke: rgba(204, 204, 204, 0.12); stroke-width: 0.5; }
  .sade { stroke: currentColor; stroke-width: 1.1; stroke-linecap: round; }
  .uusin { stroke: #3bdaa5; stroke-width: 2.4; }
</style></head><body>
  <div class="sisalto">
    <div class="merkki">
      <svg viewBox="-0.8 0 20 20"><rect x="1" y="7" width="2.6" height="6" rx="1.3"/><rect x="5.6" y="3" width="2.6" height="14" rx="1.3"/><rect x="10.2" y="5.5" width="2.6" height="9" rx="1.3"/><rect x="14.8" y="8" width="2.6" height="4" rx="1.3"/></svg>
      <span>uutisrapsa<span>.fi</span></span>
    </div>
    <div>
      <h1>Uutisraportti<span>suosittelee</span></h1>
      <p>Kaikki HS:n Uutisraportti-podcastin kulttuuri- ja tekemissuositukset haettavana ja selattavana.</p>
    </div>
    <div class="alaosa">kirjat · sarjat · elokuvat · podcastit · ruoka</div>
  </div>
  <div id="kuvio"></div>
<script>
// Sama geometria kuin app.js:n renderHeroKuvio
fetch('../suositukset.json').then(r => r.json()).then(data => {
  const jaksot = [];
  for (const j of data) {
    const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec((j.paivamaara || '').trim());
    if (!m) continue;
    jaksot.push({ pvm: new Date(+m[3], +m[2] - 1, +m[1]), n: (j.suositukset || []).filter(r => !r.piilotettu).length });
  }
  const vuodet = jaksot.map(j => j.pvm.getFullYear());
  const eka = Math.min(...vuodet), vika = Math.max(...vuodet);
  const R0 = 52, R1 = 192, vali = (R1 - R0) / (vika - eka + 1);
  const sade = v => R0 + (v - eka) * vali, f = x => x.toFixed(1);
  let s = '';
  for (let v = eka; v <= vika + 1; v++) s += `<circle class="rengas" r="${f(sade(v))}"/>`;
  jaksot.sort((a, b) => a.pvm - b.pvm);
  jaksot.forEach((j, i) => {
    const kulma = ((j.pvm - new Date(j.pvm.getFullYear(), 0, 1)) / 864e5 / 366) * 2 * Math.PI - Math.PI / 2;
    const r1 = sade(j.pvm.getFullYear()) + 1.2, r2 = r1 + Math.min(vali - 2.4, 0.6 + j.n * 1.25);
    const c = Math.cos(kulma), si = Math.sin(kulma);
    s += `<line class="sade${i === jaksot.length - 1 ? ' uusin' : ''}" x1="${f(r1 * c)}" y1="${f(r1 * si)}" x2="${f(r2 * c)}" y2="${f(r2 * si)}"/>`;
  });
  document.getElementById('kuvio').innerHTML = `<svg viewBox="-200 -200 400 400" width="640" height="640">${s}</svg>`;
});
</script>
</body></html>
