<!DOCTYPE html>
<!-- Jakokuvan (og-image.png, 1200×630) lähde, Muotokirja-ilmeen toinen kierros (29.10.2026):
     etusivun hero (pilleri, otsikko, ingressi, kategoriasirut) vasemmalla ja oikealla kolme
     etusivun suosituskorttia (.rec-card) oikeasta datasta. Kortit luetaan ../suositukset.jsonista
     KORTIT-listan teoksista (uusin ei-piilotettu suositus); "N× suositeltu" = eri jaksojen määrä
     kuten etusivun teosRyhmat. Ei lukumääriä tekstinä, jotta kuva ei vanhene.
     Edellinen versio (vuosirengaskuvio, minttu "suosittelee") on git-historiassa (20.10.2026).
     Renderöinti: kuvalahteet/tee_kuvat.sh -->
<html lang="fi"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..500&display=block" rel="stylesheet">
<style>
  /* Arvot = style.css:n tumma teema */
  :root {
    --bg-sivu: #111111; --bg-kortti: #171717; --bg-tagi: rgba(204, 204, 204, 0.07);
    --teksti-ensisijainen: #cccccc; --teksti-toissijainen: #a3a3a3; --teksti-himmea: #858585;
    --badge-teksti: #858585;
    --vari: #3bdaa5; --vari-teksti: #3bdaa5; --vari-tausta: rgba(59, 218, 165, 0.16); --vari-paalla: #111111;
    --kat-l: 0.76; --kat-c: 0.08; --av-tausta-l: 0.3; --av-teksti-l: 0.88; --av-c: 0.045;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; background: var(--bg-sivu); overflow: hidden; }
  body {
    position: relative;
    color: var(--teksti-ensisijainen);
    font-family: 'Geist', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .ikoni { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* === Vasen: etusivun hero === */
  .sisalto {
    position: absolute; left: 72px; top: 0; width: 600px; height: 630px;
    display: flex; flex-direction: column; padding: 60px 0 64px;
  }
  .merkki { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 600; letter-spacing: -0.03em; color: #ededed; }
  .merkki svg { width: 27px; height: 27px; fill: var(--vari); }
  .merkki span span { color: var(--teksti-himmea); font-weight: 500; }
  .keski { margin-top: auto; }
  .pilleri {
    display: inline-flex; align-items: center; gap: 10px;
    height: 44px; padding: 0 20px 0 17px; border-radius: 100px;
    background: var(--bg-tagi); font-size: 18px; font-weight: 500; color: var(--teksti-ensisijainen);
  }
  .pallo { width: 9px; height: 9px; border-radius: 50%; background: var(--vari); box-shadow: 0 0 0 4px var(--vari-tausta); }
  h1 { margin-top: 26px; font-size: 100px; font-weight: 600; line-height: 0.98; letter-spacing: -0.05em; color: var(--teksti-ensisijainen); }
  p.ingressi { margin-top: 24px; max-width: 560px; font-size: 25px; line-height: 1.4; color: var(--teksti-toissijainen); letter-spacing: -0.01em; }
  p.ingressi b { color: var(--teksti-ensisijainen); font-weight: 500; }
  .sirut { margin-top: auto; display: flex; gap: 8px; }
  .siru {
    display: inline-flex; align-items: center; height: 40px; padding: 0 18px; border-radius: 100px;
    background: var(--bg-tagi); font-size: 17px; font-weight: 500; color: var(--teksti-ensisijainen); white-space: nowrap;
  }
  .siru.valittu { background: var(--vari); color: var(--vari-paalla); }

  /* === Oikea: etusivun suosituskortit (style.css .rec-card, hieman suurennettuna) === */
  .kortit { position: absolute; left: 724px; top: 40px; width: 436px; display: flex; flex-direction: column; gap: 14px; }
  .rec-card { padding: 26px 28px 26px; background: var(--bg-kortti); border-radius: 20px; }
  .rec-top { display: flex; align-items: center; gap: 10px; min-height: 28px; margin-bottom: 16px; }
  .kat {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--badge-teksti); white-space: nowrap;
  }
  .kat .ikoni { width: 17px; height: 17px; color: oklch(var(--kat-l) var(--kat-c) var(--savy)); }
  .toisto {
    display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 11px; border-radius: 100px;
    background: var(--vari-tausta); color: var(--vari-teksti); font-size: 13px; font-weight: 500; white-space: nowrap;
  }
  .toisto .ikoni { width: 14px; height: 14px; }
  .sydan { margin-left: auto; color: var(--teksti-himmea); }
  .sydan .ikoni { width: 19px; height: 19px; }
  .rec-title { font-size: 25px; font-weight: 600; line-height: 1.15; letter-spacing: -0.035em; color: var(--teksti-ensisijainen); }
  .rec-desc {
    margin-top: 10px; font-size: 15.5px; line-height: 1.55; color: var(--teksti-toissijainen);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .rec-footer { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
  .henkilo { display: inline-flex; align-items: center; gap: 10px; font-size: 14.5px; font-weight: 500; }
  .avatar {
    display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
    background: oklch(var(--av-tausta-l) var(--av-c) var(--savy));
    color: oklch(var(--av-teksti-l) calc(var(--av-c) * 1.7) var(--savy));
    font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
  }
  .linkki {
    margin-left: auto; display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 12px 0 15px;
    border-radius: 100px; background: var(--bg-tagi); font-size: 13.5px; font-weight: 500;
  }
  .linkki .ikoni { width: 14px; height: 14px; }
  /* Alin kortti jatkuu kuvan alareunan yli kuin vieritettävä lista */
  .haalistus { position: absolute; left: 700px; right: 0; bottom: 0; height: 90px; background: linear-gradient(transparent, var(--bg-sivu)); }
</style></head><body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-tv-sarja" viewBox="0 0 24 24"><rect x="3" y="6.5" width="18" height="12" rx="2"/><path d="M8.5 21.5h7M8.5 2.5 12 6l3.5-3.5"/></symbol>
    <symbol id="i-podcast" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></symbol>
    <symbol id="i-kirja" viewBox="0 0 24 24"><path d="M3 5.5c2.6-1.1 5.6-.9 9 1.2V20c-3.4-2.1-6.4-2.3-9-1.2z"/><path d="M21 5.5c-2.6-1.1-5.6-.9-9 1.2V20c3.4-2.1 6.4-2.3 9-1.2z"/></symbol>
    <symbol id="i-toisto" viewBox="0 0 24 24"><path d="M17 3l3.5 3.5L17 10"/><path d="M3.5 11.5v-1.5A3.5 3.5 0 0 1 7 6.5h13.5M7 21l-3.5-3.5L7 14"/><path d="M20.5 12.5V14a3.5 3.5 0 0 1-3.5 3.5H3.5"/></symbol>
    <symbol id="i-sydan" viewBox="0 0 24 24"><path d="M12 20s-7.4-4.5-9.1-9.3C1.8 7.5 4 4.5 7.1 4.5c2 0 3.3 1.1 4.9 3 1.6-1.9 2.9-3 4.9-3 3.1 0 5.3 3 4.2 6.2C19.4 15.5 12 20 12 20z"/></symbol>
    <symbol id="i-ulos" viewBox="0 0 24 24"><path d="M8 16 16 8M9.5 8H16v6.5"/></symbol>
  </svg>

  <div class="sisalto">
    <div class="merkki">
      <svg viewBox="-0.8 0 20 20"><rect x="1" y="7" width="2.6" height="6" rx="1.3"/><rect x="5.6" y="3" width="2.6" height="14" rx="1.3"/><rect x="10.2" y="5.5" width="2.6" height="9" rx="1.3"/><rect x="14.8" y="8" width="2.6" height="4" rx="1.3"/></svg>
      <span>uutisrapsa<span>.fi</span></span>
    </div>
    <div class="keski">
      <span class="pilleri"><span class="pallo"></span>Uusi jakso joka torstai</span>
      <h1>Uutisraportti suosittelee</h1>
      <p class="ingressi">Kaikki <b>HS:n Uutisraportti-podcastin</b> kulttuuri- ja tekemissuositukset haettavana ja selattavana.</p>
    </div>
    <div class="sirut" style="margin-top:36px">
      <span class="siru valittu">Kaikki</span><span class="siru">Kirjat</span><span class="siru">TV-sarjat</span><span class="siru">Podcastit</span><span class="siru">Elokuvat</span>
    </div>
  </div>

  <div class="kortit" id="kortit"></div>
  <div class="haalistus"></div>
<script>
// Kortteihin valitut suositukset: eri juontajat ja kategoriat, toistuvasti suositeltuja;
// [teos, suosittelija, jakson päivämäärä] = se suositus, jonka kuvaus esittelee teoksen parhaiten.
// Avatarien sävyt = etusivun AVATAR_SAVYT-jako (tarkistettu sivulta 29.10.2026).
const KORTIT = [
  ['Slow Horses', 'Marko Junkkari', '11.5.2023'],
  ['The Rest Is History', 'Salla Vuorikoski', '29.12.2022'],
  ['Wind of Change', 'Tuomas Peltomäki', '28.5.2020'],
];
const SAVYT = { 'Marko Junkkari': 230, 'Salla Vuorikoski': 295, 'Tuomas Peltomäki': 330 };
const KATEGORIAT = { kirja: ['Kirja', 60], 'tv-sarja': ['TV-sarja', 250], podcast: ['Podcast', 165] };
const avain = t => t.toLowerCase().replace(/\s*[(:–-].*$/, '').trim();
const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ikoni = (id, l = '') => `<svg class="ikoni ${l}"><use href="#${id}"/></svg>`;
const kirjaimet = n => n.split(/\s+/).map(o => o[0]).slice(0, 2).join('').toUpperCase();
const LINKIT = [['goodreads', 'Goodreads'], ['imdb', 'IMDb'], ['spotify', 'Spotify'], ['apple', 'Apple Podcasts']];

fetch('../suositukset.json').then(r => r.json()).then(data => {
  let html = '';
  for (const [nimi, kuka, pvm] of KORTIT) {
    const k = avain(nimi), jaksot = new Set();
    let uusin = null;
    for (const j of data) for (const r of j.suositukset || []) {
      if (r.piilotettu || r.antisuositus || avain(r.teos) !== k) continue;
      jaksot.add(j.id || j.paivamaara);
      if (r.suosittelija === kuka && j.paivamaara === pvm) uusin = r;
    }
    if (!uusin) continue;
    const [katNimi, katSavy] = KATEGORIAT[uusin.paakategoria] || ['Muu', 230];
    const host = (uusin.lisatieto_linkki || '').toLowerCase();
    const palvelu = (LINKIT.find(([h]) => host.includes(h)) || [null, uusin.paakategoria === 'podcast' ? 'Spotify' : 'Google'])[1];
    html += `<article class="rec-card">
      <div class="rec-top">
        <span class="kat" style="--savy:${katSavy}">${ikoni('i-' + (uusin.paakategoria in KATEGORIAT ? uusin.paakategoria : 'kirja'))}${katNimi}</span>
        ${jaksot.size >= 2 ? `<span class="toisto">${ikoni('i-toisto')}${jaksot.size}× suositeltu</span>` : ''}
        <span class="sydan">${ikoni('i-sydan')}</span>
      </div>
      <h2 class="rec-title">${esc(nimi)}</h2>
      <p class="rec-desc">${esc(uusin.kuvaus)}</p>
      <div class="rec-footer">
        <span class="henkilo"><span class="avatar" style="--savy:${SAVYT[uusin.suosittelija]}">${kirjaimet(uusin.suosittelija)}</span>${esc(uusin.suosittelija)}</span>
        <span class="linkki">${palvelu}${ikoni('i-ulos')}</span>
      </div>
    </article>`;
  }
  document.getElementById('kortit').innerHTML = html;
});
</script>
</body></html>
